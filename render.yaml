# Render Blueprint — deploys the full SpruVex R stack on Render's free tier.
#
# NOT deploy-verified: this sandbox has no way to create a Render account or
# trigger an actual deploy, so this file is reviewed-but-unproven, same
# caveat as docker-compose.prod.yml. See docs/RENDER_DEPLOY.md for the full
# walkthrough. The database lives on Neon (free, non-expiring); the API
# creates its RLS-restricted role and runs migrations itself on boot.
#
# Free-tier notes:
#   - Free web services spin down after 15 min of inactivity (cold start on
#     the next request). See docs/RENDER_DEPLOY.md for upgrade notes.
#   - Redis is intentionally not provisioned here: the realtime layer
#     already degrades gracefully to an in-memory adapter when REDIS_URL is
#     unset (shared/realtime/redis-io.adapter.ts) — fine for a single
#     instance, which is all the free tier gives you anyway.

# Database: NOT provisioned on Render. Render's free Postgres is deleted
# after 30 days (that is what happened to the old spruvex-r-db). We use a
# free Neon project instead (https://neon.tech) — it never expires, it only
# sleeps when idle and wakes on the next query. See docs/RENDER_DEPLOY.md.

services:
  - type: web
    name: spruvex-r-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Paste Neon's connection string (owner role, direct — NOT the
      # "-pooler" host) here. Migrations + platform-admin queries use it.
      - key: ADMIN_DATABASE_URL
        sync: false
      # DATABASE_URL is intentionally not set: the API derives it from
      # ADMIN_DATABASE_URL + this password, connecting as the restricted
      # NOBYPASSRLS role `spruvex_app` (shared/prisma/derive-app-database-url.ts).
      - key: BOOTSTRAP_APP_ROLE_PASSWORD
        generateValue: true
      # Both idempotent, so they stay on: every boot ensures the spruvex_app
      # role/grants exist and applies any pending migrations.
      - key: RUN_DB_BOOTSTRAP
        value: "true"
      - key: RUN_DB_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Not generateValue: spruvex-site (a separate deployment) must be
      # configured with this exact same value — generate one with
      # `openssl rand -hex 32` and paste it into both places by hand.
      - key: SPRUVEX_SITE_API_KEY
        sync: false
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://spruvex-r-dashboard.onrender.com,https://spruvex-r-pos.onrender.com,https://spruvex-r-kds.onrender.com,https://spruvex-r-ordering.onrender.com,https://spruvex-r-platform.onrender.com"
      - key: ORDERING_BASE_URL
        value: https://spruvex-r-ordering.onrender.com
      # Returned to spruvex-site by POST /public/trial-signup (and used in
      # emails) as the link the new merchant signs in at.
      - key: DASHBOARD_BASE_URL
        value: https://spruvex-r-dashboard.onrender.com
      # Used to build absolute URLs for uploaded logo/product/category
      # images. NOTE: the free plan's disk is ephemeral — uploaded files
      # are lost on every redeploy/restart. Fine for "try it out"; needs a
      # Render persistent Disk (paid) or a real object-storage backend
      # (swap modules/uploads/uploads.service.ts) before relying on this
      # for actual customer data.
      - key: PUBLIC_API_ORIGIN
        value: https://spruvex-r-api.onrender.com
      # Optional — set these two to bootstrap the first platform admin login
      # on first deploy, then unset them (see docs/RENDER_DEPLOY.md).
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      # Optional error tracking — leave unset, zero behavior change.
      - key: SENTRY_DSN
        sync: false
      # Only needed once some tenant enables ZATCA Phase 2 e-invoicing —
      # encrypts their CSID credentials at rest. Generate a long random value.
      - key: ZATCA_CREDENTIALS_ENCRYPTION_KEY
        sync: false

  - type: web
    name: spruvex-r-dashboard
    runtime: docker
    dockerfilePath: ./apps/dashboard/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Must be the API's PUBLIC https URL, not `fromService: hostport`: the
      # nginx proxy resolves it over public DNS (1.1.1.1) and needs a scheme,
      # and Render's private `host:port` has neither. Syncing the old
      # hostport value broke every login with a 5xx.
      - key: API_INTERNAL_ORIGIN
        value: https://spruvex-r-api.onrender.com

  - type: web
    name: spruvex-r-pos
    runtime: docker
    dockerfilePath: ./apps/pos/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Must be the API's PUBLIC https URL, not `fromService: hostport`: the
      # nginx proxy resolves it over public DNS (1.1.1.1) and needs a scheme,
      # and Render's private `host:port` has neither. Syncing the old
      # hostport value broke every login with a 5xx.
      - key: API_INTERNAL_ORIGIN
        value: https://spruvex-r-api.onrender.com

  - type: web
    name: spruvex-r-kds
    runtime: docker
    dockerfilePath: ./apps/kds/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Must be the API's PUBLIC https URL, not `fromService: hostport`: the
      # nginx proxy resolves it over public DNS (1.1.1.1) and needs a scheme,
      # and Render's private `host:port` has neither. Syncing the old
      # hostport value broke every login with a 5xx.
      - key: API_INTERNAL_ORIGIN
        value: https://spruvex-r-api.onrender.com

  - type: web
    name: spruvex-r-platform
    runtime: docker
    dockerfilePath: ./apps/platform/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Must be the API's PUBLIC https URL, not `fromService: hostport`: the
      # nginx proxy resolves it over public DNS (1.1.1.1) and needs a scheme,
      # and Render's private `host:port` has neither. Syncing the old
      # hostport value broke every login with a 5xx.
      - key: API_INTERNAL_ORIGIN
        value: https://spruvex-r-api.onrender.com

  - type: web
    name: spruvex-r-ordering
    runtime: docker
    dockerfilePath: ./apps/ordering/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: API_ORIGIN
        fromService:
          type: web
          name: spruvex-r-api
          property: hostport
      - key: PUBLIC_API_ORIGIN
        value: https://spruvex-r-api.onrender.com

# Redeploy trigger: force all services to rebuild with the corrected
# dockerContext/dockerfilePath (the 5 that failed were built before that fix).
